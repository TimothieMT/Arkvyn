# HTTP → HTTPS Redirect (Google indexiert nur die kanonische HTTPS-Variante)
server {
    listen 80;
    server_name arkvyn.de www.arkvyn.de 178.104.24.155;

    # Certbot ACME-Challenge muss über HTTP erreichbar bleiben
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://arkvyn.de$request_uri;
    }
}

# www → non-www (eine einzige kanonische Domain)
server {
    listen 443 ssl;
    http2 on;
    server_name www.arkvyn.de;

    ssl_certificate     /etc/letsencrypt/live/arkvyn.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arkvyn.de/privkey.pem;

    return 301 https://arkvyn.de$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name arkvyn.de;

    ssl_certificate     /etc/letsencrypt/live/arkvyn.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arkvyn.de/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/arkvyn/dist;
    index index.html;

    # Kompression – ohne gzip liefert nginx JS/CSS unkomprimiert aus
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml image/svg+xml;

    # Security-Header (Ranking-/Trust-Signale, verhindern Framing & Sniffing)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # React SPA – alle Routen auf index.html (prerenderte Dateien greifen zuerst)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Statische Assets – lange Cache-Zeit (Dateinamen sind content-gehasht)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Backend API – Proxy zu Node.js
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout     30s;
    }
}
