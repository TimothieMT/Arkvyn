# HTTP → HTTPS + www → non-www
server {
    listen 80;
    listen [::]:80;
    server_name arkvyn.de www.arkvyn.de;

    location /.well-known/acme-challenge/ {
        root /var/www/arkvyn/dist;
        allow all;
    }

    location / {
        return 301 https://arkvyn.de$request_uri;
    }
}

# www HTTPS → non-www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.arkvyn.de;

    ssl_certificate     /etc/letsencrypt/live/arkvyn.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arkvyn.de/privkey.pem;

    return 301 https://arkvyn.de$request_uri;
}

# Hauptserver: arkvyn.de
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name arkvyn.de;

    ssl_certificate     /etc/letsencrypt/live/arkvyn.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arkvyn.de/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/arkvyn/dist;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml image/svg+xml;

    # Security-Header
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Block spam URLs
    location ~ ^/(but-landed-broke-on-her-quad|flavour-and-his-cult-following|art-guy-with-such-genius|if-cow-urine-could-run-it)/?$ {
        return 404;
    }

    # Bekannte Routen werden prerendered ausgeliefert; unbekannte URLs bleiben echte 404.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }

    # Statische Assets – 1 Jahr Cache (content-gehasht)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Backend API
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout     30s;
    }
}
